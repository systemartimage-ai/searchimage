<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0d0b" />
    <title>Sem conexão — Artimage Search</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0e0d0b;
        color: #f5f3ef;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0;
        max-width: 360px;
        color: rgba(245, 243, 239, 0.7);
        font-size: 15px;
        line-height: 1.5;
      }
      button {
        margin-top: 8px;
        padding: 10px 22px;
        border: 0;
        background: #f5f3ef;
        color: #0e0d0b;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Artimage" />
      <h1>Sem conexão com a internet</h1>
      <p>A busca precisa de internet para consultar o catálogo. Verifique a conexão e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
